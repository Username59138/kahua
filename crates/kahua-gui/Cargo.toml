[package]
name = "kahua-gui"
description = "Kahua editor window (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "wayland", "x11"] }
kahua-core = { version = "0.1.0", path = "../kahua-core" }
kahua-render = { version = "0.1.0", path = "../kahua-render" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
